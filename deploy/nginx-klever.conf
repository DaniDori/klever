server {
    listen 80;
    server_name klever-ya.ru www.klever-ya.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://klever-ya.ru$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name klever-ya.ru www.klever-ya.ru;
    ssl_certificate /etc/letsencrypt/live/klever-ya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/klever-ya.ru/privkey.pem;

    if ($host = www.klever-ya.ru) {
        return 301 https://klever-ya.ru$request_uri;
    }

    # Ограничения на время переноса данных из резервной копии.
    add_header X-Robots-Tag "noindex, nofollow" always;
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    location = /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location = /sitemap.xml { return 404; }
    location ~ ^/admin(?:\.html)?(?:/|$) { return 404; }
    location /api/ { return 404; }

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location = /api/content.js {
        proxy_pass http://127.0.0.1:8080;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
