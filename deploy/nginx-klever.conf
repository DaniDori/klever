server {
    listen 80;
    server_name klever-ya.ru www.klever-ya.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        try_files $uri =404;
    }

    location / {
        return 301 https://klever-ya.ru$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
}

server {
    listen 443 ssl;
    server_name klever-ya.ru www.klever-ya.ru;
    ssl_certificate /etc/letsencrypt/live/klever-ya.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/klever-ya.ru/privkey.pem;

    if ($host = www.klever-ya.ru) {
        return 301 https://klever-ya.ru$request_uri;
    }

    client_max_body_size 12m;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    location / {
        proxy_pass http://127.0.0.1:8080;
    }
}
